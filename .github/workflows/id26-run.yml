name: ID26 run

on:
  push:
    branches:
      - agent/id26-keyboard-project-depth-repeat-dates-work

permissions:
  contents: write

jobs:
  run-id26:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/id26-keyboard-project-depth-repeat-dates-work
      - name: Apply and verify
        run: python3 .github/id26_apply.py
      - name: Commit implementation
        run: |
          rm .github/id26_apply.py .github/workflows/id26-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ID26: improve taxonomy keyboard access and repeat date validation"
          git push origin HEAD:agent/id26-keyboard-project-depth-repeat-dates-work
